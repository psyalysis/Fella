<!DOCTYPE html>
<html>
<head>
    <title>Phone Gyro Sender</title>
</head>
<body>
    <h1>Sending Gyro Data...</h1>
    <script>
        const socket = new WebSocket("ws://192.168.1.100:5000/socket.io/?EIO=4&transport=websocket");

        socket.onopen = () => console.log("Connected to server");

        window.addEventListener("deviceorientation", (event) => {
            const data = {
                alpha: event.alpha, // Rotation around z-axis
                beta: event.beta,   // Rotation around x-axis
                gamma: event.gamma  // Rotation around y-axis
            };
            socket.send(JSON.stringify({ event: "gyro_data", data }));
        });
    </script>
</body>
</html>
