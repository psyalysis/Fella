<!DOCTYPE html>
<html>
<head>
    <title>Gyro Display</title>
</head>
<body>
    <h1>Gyroscope Data</h1>
    <p>Alpha: <span id="alpha">0</span></p>
    <p>Beta: <span id="beta">0</span></p>
    <p>Gamma: <span id="gamma">0</span></p>

    <script>
        const socket = new WebSocket("ws://192.168.1.100:5000/socket.io/?EIO=4&transport=websocket");

        socket.onmessage = (event) => {
            let message = JSON.parse(event.data);
            if (message.event === "update_display") {
                document.getElementById("alpha").innerText = message.data.alpha;
                document.getElementById("beta").innerText = message.data.beta;
                document.getElementById("gamma").innerText = message.data.gamma;
            }
        };
    </script>
</body>
</html>
